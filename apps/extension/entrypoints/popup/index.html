<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mochiscout reader</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #111; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { color: #555; margin: 0 0 12px; }
      label { display: block; font-weight: 600; margin: 10px 0 4px; }
      input { box-sizing: border-box; width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
      button { margin-top: 12px; width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #111; color: #fff; font: inherit; cursor: pointer; }
      #status { margin-top: 12px; color: #555; }
      .error { color: #b42318; }
    </style>
  </head>
  <body>
    <h1>Mochiscout reader</h1>
    <p>Sends the Reddit posts you browse to your inbox. Read-only.</p>
    <form id="form">
      <label for="url">Your Mochiscout URL</label>
      <input id="url" type="url" placeholder="https://radar.example.com" required />
      <label for="key">API key</label>
      <input id="key" type="password" placeholder="sr_…" required />
      <button type="submit">Save</button>
    </form>
    <div id="status"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
